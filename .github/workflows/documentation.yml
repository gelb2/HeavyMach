name: Documentation and resources
on:
  push:
    branches: [main, develop, 'docs/**', 'fix/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - run: python3 tools/document_contract.py check
      - run: python3 tools/check_publication.py
      - run: python3 tools/verify_build_resources.py
      - run: python3 -m unittest discover -s tools/tests -p "test_release.py"
      - run: python3 -m unittest discover -s tools/tests -p "test_cleanup_browser_apps.py"
