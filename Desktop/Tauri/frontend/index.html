<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heavy Mach Desktop</title><link rel="stylesheet" href="skin/skin.css"></head><body><main><img class="logo" src="skin/title.png" alt="Heavy Mach"><section class="panel"><h1>Ready for battle</h1><div class="status-panel"><p id="status" role="status">Checking saved progress…</p></div><p id="error" role="alert" hidden></p><div class="actions"><button id="start" class="primary" hidden>Play</button><button id="retry" hidden>Retry</button></div><details><summary>Saved progress</summary><div class="actions"><button id="export">Export save</button><button id="import">Import save</button><button id="recover" hidden>Restore last backup</button></div><p id="backup-info" class="hint"></p></details></section><dialog id="confirm-restore"><h2>Restore saved progress?</h2><p>Your current progress and backup files will be kept in the recovery folder.</p><div class="actions"><button id="cancel-restore">Cancel</button><button id="apply-restore">Restore</button></div></dialog></main><script src="boot.js"></script></body></html>
