name: HeavyMachRestored
options:
  deploymentTarget:
    iOS: '15.0'
fileGroups:
- ../docs
- ../README.md
schemes:
  HeavyMachRestored:
    build:
      targets:
        HeavyMachRestored: all
    run:
      config: Debug
  HeavyMachValidation:
    build:
      targets:
        HeavyMachValidation: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - HeavyMachRenderTests
targets:
  HeavyMachRestored:
    type: application
    platform: iOS
    preBuildScripts:
    - name: Build preserved OpenAL Soft
      script: bash "$SRCROOT/../tools/build_openal.sh" "$PLATFORM_NAME"
      basedOnDependencyAnalysis: false
      outputFiles:
      - $(SRCROOT)/../build/openal/$(PLATFORM_NAME)/libopenal.a
    dependencies:
    - target: Modules/HeavyMachSaveTransfer_iOS
      embed: false
    - sdk: UIKit.framework
    - sdk: QuartzCore.framework
    - sdk: AVFoundation.framework
    - sdk: CoreMotion.framework
    - sdk: CoreGraphics.framework
    - sdk: CoreText.framework
    - sdk: OpenGLES.framework
    - sdk: AudioToolbox.framework
    - sdk: CoreAudio.framework
    - target: Modules/HeavyMachCore_iOS
      embed: false
    - target: Modules/HeavyMachAssets_iOS
      link: false
      embed: false
    - bundle: HeavyMachAssets.bundle
    - target: Modules/HeavyMachAppleRuntime_iOS
      embed: false
    - sdk: GameController.framework
    sources:
    - path: ../Sources/OriginalInterfaces
      buildPhase: none
    - path: ../Resources/Assets.xcassets
    - path: ../Sources/iOS/Application.mm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelb2.heavymach.restored
        OTHER_LDFLAGS:
        - $(inherited)
        - -force_load
        - $(SRCROOT)/../build/openal/$(PLATFORM_NAME)/libopenal.a
        - -ObjC
        PRODUCT_NAME: HeavyMachRestored
        DEVELOPMENT_TEAM: PDF8XXXYH9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1,2
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: true
        GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - HM_VALIDATION=0
        OTHER_CPLUSPLUSFLAGS:
        - $(inherited)
        - -ffp-contract=off
        - -fno-fast-math
        HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../Sources/Core
        - $(SRCROOT)/../Sources/Apple
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: 'NO'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Heavy Mach 1
        CFBundleShortVersionString: '1.13'
        CFBundleVersion: '1'
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        UIRequiresFullScreen: true
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
  HeavyMachValidation:
    type: application
    platform: iOS
    preBuildScripts:
    - name: Build preserved OpenAL Soft
      script: bash "$SRCROOT/../tools/build_openal.sh" "$PLATFORM_NAME"
      basedOnDependencyAnalysis: false
      outputFiles:
      - $(SRCROOT)/../build/openal/$(PLATFORM_NAME)/libopenal.a
    dependencies:
    - target: Modules/HeavyMachSaveTransfer_iOS
      embed: false
    - sdk: UIKit.framework
    - sdk: QuartzCore.framework
    - sdk: AVFoundation.framework
    - sdk: CoreMotion.framework
    - sdk: CoreGraphics.framework
    - sdk: CoreText.framework
    - sdk: OpenGLES.framework
    - sdk: AudioToolbox.framework
    - sdk: CoreAudio.framework
    - target: Modules/HeavyMachValidationCore_iOS
      embed: false
    - target: Modules/HeavyMachAssets_iOS
      link: false
      embed: false
    - bundle: HeavyMachAssets.bundle
    - target: Modules/HeavyMachValidationRuntime_iOS
      embed: false
    - sdk: GameController.framework
    sources:
    - path: ../Sources/OriginalInterfaces
      buildPhase: none
    - path: ../Resources/Validation
      type: folder
      buildPhase: resources
    - path: ../Resources/Assets.xcassets
    - path: ../Sources/iOS/Application.mm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelb2.heavymach.validation
        OTHER_LDFLAGS:
        - $(inherited)
        - -force_load
        - $(SRCROOT)/../build/openal/$(PLATFORM_NAME)/libopenal.a
        - -ObjC
        PRODUCT_NAME: HeavyMachValidation
        DEVELOPMENT_TEAM: PDF8XXXYH9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1,2
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: true
        GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - HM_VALIDATION=1
        OTHER_CPLUSPLUSFLAGS:
        - $(inherited)
        - -ffp-contract=off
        - -fno-fast-math
        HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../Sources/Core
        - $(SRCROOT)/../Sources/Apple
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: 'NO'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
    info:
      path: Validation-Info.plist
      properties:
        CFBundleDisplayName: HM Validation
        CFBundleShortVersionString: '1.13'
        CFBundleVersion: '1'
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        UIRequiresFullScreen: true
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
  HeavyMachRenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: ../Tests/iOS
    - path: ../Tests/Apple
    dependencies:
    - target: HeavyMachValidation
    - sdk: UIKit.framework
    - sdk: CoreGraphics.framework
    - sdk: CoreText.framework
    - sdk: OpenGLES.framework
    - sdk: AudioToolbox.framework
    - sdk: CoreAudio.framework
    - sdk: CoreFoundation.framework
    - sdk: QuartzCore.framework
    - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelb2.heavymach.render-tests
        GENERATE_INFOPLIST_FILE: true
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: true
        HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../Sources/Core
        - $(SRCROOT)/../Sources/iOS
        - $(SRCROOT)/../Sources/Apple
        DEVELOPMENT_TEAM: PDF8XXXYH9
        CODE_SIGN_STYLE: Automatic
        GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - HM_VALIDATION=1
projectReferences:
  Modules:
    path: ../Modules/HeavyMachModules.xcodeproj
